<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
  <title id="title">Corenova EKS SSM Bastion Identity Relay architecture</title>
  <desc id="desc">An operator uses their own AWS identity with kubectl while an SSM managed EC2 instance relays encrypted network traffic to a private EKS API endpoint.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      .t{font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.s{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.b{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}.l{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1d4ed8}.a{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1100" height="700" fill="#f8fafc"/>
  <text x="45" y="54" class="t">Identity Relay — per-user EKS authorization</text>
  <text x="45" y="82" class="s">No public IP • no inbound rules • EC2 role has no EKS permissions</text>
  <rect x="390" y="115" width="665" height="455" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="420" y="148" class="h">Customer VPC / private subnet</text>
  <rect x="45" y="210" width="255" height="175" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="75" y="253" class="h">Operator workstation</text>
  <text x="75" y="285" class="b">AWS CLI + kubectl</text>
  <text x="75" y="310" class="b">Session Manager plugin</text>
  <text x="75" y="340" class="b">EKS token: operator IAM role</text>
  <text x="75" y="365" class="b">TLS verifies real EKS hostname</text>
  <rect x="445" y="210" width="260" height="175" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="510" y="253" class="h">AWS Systems Manager</text>
  <text x="475" y="285" class="b">Remote-host port forwarding</text>
  <text x="475" y="310" class="b">Outbound-managed channels</text>
  <text x="475" y="340" class="b">EC2 role: SSM core only</text>
  <text x="475" y="365" class="b">No shell is required</text>
  <image href="icons/aws-systems-manager.png" x="460" y="225" width="40" height="40"/>
  <rect x="760" y="195" width="245" height="205" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="825" y="238" class="h">Corenova relay</text>
  <text x="790" y="278" class="b">Amazon EC2 + SSM Agent</text>
  <text x="790" y="303" class="b">Encrypted gp3 + IMDSv2</text>
  <rect x="790" y="320" width="185" height="48" rx="10" fill="#dcfce7"/>
  <text x="810" y="341" class="b">0 inbound rules</text>
  <text x="810" y="359" class="b">0 EKS IAM actions</text>
  <image href="icons/amazon-ec2.png" x="775" y="215" width="48" height="48"/>
  <rect x="650" y="455" width="355" height="78" rx="16" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="720" y="488" class="h">Existing Amazon EKS cluster</text>
  <text x="720" y="513" class="b">Operator Access Entry • namespace or cluster scope</text>
  <image href="icons/amazon-eks.png" x="665" y="469" width="44" height="44"/>
  <path d="M300 275C350 275 380 275 445 275" class="a"/>
  <text x="315" y="255" class="l">StartSession + tunnel</text>
  <path d="M705 275H760" class="a"/>
  <text x="706" y="255" class="l">SSM channel</text>
  <path d="M885 400V455" class="a"/>
  <text x="900" y="432" class="l">HTTPS 443</text>
  <path d="M300 345C430 420 490 490 650 495" class="a" stroke-dasharray="8 7"/>
  <text x="365" y="430" class="l">kubectl token identifies the operator</text>
  <rect x="45" y="610" width="1010" height="52" rx="13" fill="#0f172a"/>
  <text x="70" y="642" style="font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Audit boundary: CloudTrail/EKS records the operator identity; SSM cannot log port-forwarded session contents.</text>
</svg>
