name: Guarded Marketplace AMI rebuild
run-name: Rebuild ${{ inputs.product }} at ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product key from the products.yaml allowlist
        required: true
        type: string
      expected_sha:
        description: Exact 40-character main commit SHA approved for this run
        required: true
        type: string
      confirmation:
        description: Type RUN_ONE_MARKETPLACE_REBUILD
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: corenova-marketplace-rebuild
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "582920575154"
  INGESTION_ROLE_ARN: arn:aws:iam::582920575154:role/CoreNovaMarketplaceAmiIngestion

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out approved source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked runtime
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Verify explicit approval inputs
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCT: ${{ inputs.product }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMATION" == "RUN_ONE_MARKETPLACE_REBUILD" ]]
          python - "$PRODUCT" <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from productlib import product_by_key
          product = product_by_key(sys.argv[1])
          print(f"approved product: {product['key']}")
          PY

      - name: Assume read-only observer role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::582920575154:role/CoreNovaMarketplaceObserverRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: "582920575154"
          mask-aws-account-id: true
          unset-current-credentials: true
          role-duration-seconds: 900
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Enforce rebuild cost ceiling
        run: |
          python scripts/aws_readonly_ops.py \
            --mode cost \
            --max-projected 20 \
            --output operations/reports/preflight-cost.json

      - name: Upload cost evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuild-cost-${{ github.run_id }}-${{ github.run_attempt }}
          path: operations/reports/preflight-cost.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      ami_id: ${{ steps.rebuild.outputs.ami_id }}
      source_ami_id: ${{ steps.rebuild.outputs.source_ami_id }}
      product: ${{ steps.rebuild.outputs.product }}
      version_title: ${{ steps.rebuild.outputs.version_title }}
    steps:
      - name: Check out approved source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked build dependencies
        run: |
          python -m pip install --require-hashes --requirement requirements.lock
          ansible-galaxy collection install --requirements-file ansible/requirements.yml

      - name: Set up Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.15.4"

      - name: Assume AMI builder role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::582920575154:role/CoreNovaAmiBuilderRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: "582920575154"
          mask-aws-account-id: true
          unset-current-credentials: true
          role-duration-seconds: 7200
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build and validate one marketplace AMI
        id: rebuild
        env:
          PRODUCT: ${{ inputs.product }}
        run: |
          mkdir -p operations/reports
          version_title="v$(date -u +%Y%m%d)"
          scripts/build_one.sh "$PRODUCT"
          ami_id_file="artifacts/${PRODUCT}-${version_title}.ami_id"
          if [[ ! -f "$ami_id_file" ]]; then
            ami_id_file="$(find artifacts -maxdepth 1 -name "${PRODUCT}-v*.ami_id" -print -quit)"
          fi
          [[ -n "$ami_id_file" && -f "$ami_id_file" ]]
          ami_id="$(<"$ami_id_file")"
          [[ "$ami_id" =~ ^ami-[0-9a-f]{17}$ ]]
          source_ami_id="$(python scripts/resolve_source_ami.py "$PRODUCT")"
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg product "$PRODUCT" \
            --arg ami_id "$ami_id" \
            --arg source_ami_id "$source_ami_id" \
            --arg version_title "$version_title" \
            --arg packer_version "$(packer version | head -n1)" \
            '{commit:$commit,product:$product,ami_id:$ami_id,source_ami_id:$source_ami_id,version_title:$version_title,packer_version:$packer_version}' \
            > operations/reports/build-manifest.json
          printf 'ami_id=%s\n' "$ami_id" >> "$GITHUB_OUTPUT"
          printf 'source_ami_id=%s\n' "$source_ami_id" >> "$GITHUB_OUTPUT"
          printf 'product=%s\n' "$PRODUCT" >> "$GITHUB_OUTPUT"
          printf 'version_title=%s\n' "$version_title" >> "$GITHUB_OUTPUT"

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuild-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            operations/reports/build-manifest.json
            artifacts/
            logs/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out approved source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked runtime
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Assume AMI builder role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::582920575154:role/CoreNovaAmiBuilderRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: "582920575154"
          mask-aws-account-id: true
          unset-current-credentials: true
          role-duration-seconds: 3600
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run marketplace smoke test
        env:
          PRODUCT: ${{ needs.build.outputs.product }}
          AMI_ID: ${{ needs.build.outputs.ami_id }}
        run: |
          set -o pipefail
          mkdir -p operations/reports
          scripts/smoke_test_ami.sh "$PRODUCT" "$AMI_ID" \
            | tee operations/reports/smoke-result.txt

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuild-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: operations/reports/smoke-result.txt
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 30

  validate:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out approved source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked runtime
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Assume Marketplace VALIDATE-only role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::582920575154:role/CoreNovaMarketplaceValidatorRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: "582920575154"
          mask-aws-account-id: true
          unset-current-credentials: true
          role-duration-seconds: 3600
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Render AddDeliveryOptions plan for the rebuilt AMI
        env:
          PRODUCT: ${{ needs.build.outputs.product }}
          AMI_ID: ${{ needs.build.outputs.ami_id }}
          SOURCE_AMI_ID: ${{ needs.build.outputs.source_ami_id }}
          VERSION_TITLE: ${{ needs.build.outputs.version_title }}
        run: |
          mkdir -p plans operations/reports/validate
          python scripts/render_marketplace_changeset.py \
            "$PRODUCT" "$AMI_ID" \
            --source-ami-id "$SOURCE_AMI_ID" \
            --access-role-arn "$INGESTION_ROLE_ARN" \
            --version-title "$VERSION_TITLE" \
            --output-dir plans

      - name: Submit VALIDATE and wait for terminal success
        run: |
          product="${{ needs.build.outputs.product }}"
          plan="plans/${product}-add-version.json"
          python scripts/submit_changeset.py "$plan" --intent VALIDATE \
            > operations/reports/validate/start.json
          change_set_id="$(jq -r .ChangeSetId operations/reports/validate/start.json)"
          [[ "$change_set_id" == change-set/* ]]
          status=""
          for _ in $(seq 1 240); do
            aws marketplace-catalog describe-change-set \
              --region us-east-1 --catalog AWSMarketplace \
              --change-set-id "$change_set_id" --output json \
              > operations/reports/validate/final.json
            status="$(jq -r .Status operations/reports/validate/final.json)"
            case "$status" in
              SUCCEEDED) break ;;
              FAILED|CANCELLED) jq -r '.FailureDescription // "VALIDATE failed"' operations/reports/validate/final.json >&2; exit 1 ;;
            esac
            sleep 10
          done
          [[ "$status" == "SUCCEEDED" ]]
          echo "VALIDATE_OK $product $change_set_id"

      - name: Upload validate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuild-validate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            plans/
            operations/reports/validate/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 30
