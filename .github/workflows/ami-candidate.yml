name: Guarded EKS AMI candidate
run-name: Candidate ${{ inputs.product }} at ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      product:
        description: One architecture per run
        required: true
        type: choice
        options:
          - eks-admin-bastion-al2023-x86_64
          - eks-admin-bastion-al2023-arm64
      existing_ami_id:
        description: Optional existing candidate AMI to smoke and validate instead of building
        required: false
        type: string
      source_ami_id:
        description: Optional source AMI evidence when resuming an existing candidate
        required: false
        type: string
      expected_sha:
        description: Exact 40-character main commit SHA approved for this run
        required: true
        type: string
      confirmation:
        description: Type RUN_ONE_CANDIDATE_PIPELINE
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: corenova-eks-ami-candidate
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "582920575154"
  BUILD_SUBNET_ID: subnet-015304a4430329088
  SMOKE_SUBNET_ID: subnet-015304a4430329088
  SMOKE_INSTANCE_PROFILE: CoreNovaEksBastionSmokeInstanceRole
  MARKETPLACE_INGESTION_ROLE: arn:aws:iam::582920575154:role/CoreNovaMarketplaceAmiIngestion

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out approved source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify explicit approval inputs
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMATION" == "RUN_ONE_CANDIDATE_PIPELINE" ]]

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked runtime
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Assume read-only observer role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::582920575154:role/CoreNovaMarketplaceObserverRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: "582920575154"
          mask-aws-account-id: true
          unset-current-credentials: true
          role-duration-seconds: 900
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Enforce build cost ceiling
        run: |
          python scripts/aws_readonly_ops.py \
            --mode cost \
            --max-projected 20 \
            --output operations/reports/preflight-cost.json

      - name: Upload cost evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-cost-${{ github.run_id }}-${{ github.run_attempt }}
          path: operations/reports/preflight-cost.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      ami_id: ${{ steps.candidate.outputs.ami_id }}
      source_ami_id: ${{ steps.candidate.outputs.source_ami_id }}
      product: ${{ steps.candidate.outputs.product }}
    steps:
      - name: Check out approved source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked build dependencies
        run: |
          python -m pip install --require-hashes --requirement requirements.lock
          ansible-galaxy collection install --requirements-file ansible/requirements.yml

      - name: Set up Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.15.4"

      - name: Assume AMI builder role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::582920575154:role/CoreNovaAmiBuilderRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: "582920575154"
          mask-aws-account-id: true
          unset-current-credentials: true
          role-duration-seconds: 3600
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build or select one candidate
        id: candidate
        env:
          PRODUCT: ${{ inputs.product }}
          EXISTING_AMI_ID: ${{ inputs.existing_ami_id }}
          EXISTING_SOURCE_AMI_ID: ${{ inputs.source_ami_id }}
        run: |
          mkdir -p operations/reports
          version="v$(date -u +%Y%m%d)"
          if [[ -n "$EXISTING_AMI_ID" ]]; then
            [[ "$EXISTING_AMI_ID" =~ ^ami-[0-9a-f]{17}$ ]]
            if [[ -n "$EXISTING_SOURCE_AMI_ID" ]]; then
              [[ "$EXISTING_SOURCE_AMI_ID" =~ ^ami-[0-9a-f]{17}$ ]]
            fi
            ami_id="$EXISTING_AMI_ID"
            source_ami_id="$EXISTING_SOURCE_AMI_ID"
            CORENOVA_PRODUCTS_FILE=products.candidates.yaml \
              python scripts/validate_ami.py "$PRODUCT" "$ami_id"
          else
            scripts/build_candidate.sh "$PRODUCT"
            ami_id="$(<"artifacts/${PRODUCT}-${version}.ami_id")"
            source_ami_id="$(<"artifacts/${PRODUCT}-${version}.source_ami_id")"
          fi
          [[ "$ami_id" =~ ^ami-[0-9a-f]{17}$ ]]
          CORENOVA_PRODUCTS_FILE=products.candidates.yaml \
            python scripts/validate_ami.py "$PRODUCT" "$ami_id"
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg product "$PRODUCT" \
            --arg ami_id "$ami_id" \
            --arg source_ami_id "$source_ami_id" \
            --arg packer_version "$(packer version | head -n1)" \
            '{commit:$commit,product:$product,ami_id:$ami_id,source_ami_id:$source_ami_id,packer_version:$packer_version}' \
            > operations/reports/build-manifest.json
          printf 'ami_id=%s\n' "$ami_id" >> "$GITHUB_OUTPUT"
          printf 'source_ami_id=%s\n' "$source_ami_id" >> "$GITHUB_OUTPUT"
          printf 'product=%s\n' "$PRODUCT" >> "$GITHUB_OUTPUT"

      - name: Upload minimal build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: operations/reports/build-manifest.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out approved source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked runtime
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Assume read-only observer role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::582920575154:role/CoreNovaMarketplaceObserverRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: "582920575154"
          mask-aws-account-id: true
          unset-current-credentials: true
          role-duration-seconds: 900
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Enforce smoke cost ceiling
        run: |
          python scripts/aws_readonly_ops.py \
            --mode cost \
            --max-projected 24 \
            --output operations/reports/smoke-cost.json

      - name: Assume smoke runner role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::582920575154:role/CoreNovaEksBastionSmokeRunnerRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: "582920575154"
          mask-aws-account-id: true
          unset-current-credentials: true
          role-duration-seconds: 1800
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run no-ingress SSM smoke test
        env:
          PRODUCT: ${{ needs.build.outputs.product }}
          AMI_ID: ${{ needs.build.outputs.ami_id }}
          CORENOVA_SMOKE_SUBNET_ID: ${{ env.SMOKE_SUBNET_ID }}
          CORENOVA_SMOKE_INSTANCE_PROFILE_NAME: ${{ env.SMOKE_INSTANCE_PROFILE }}
          CORENOVA_SMOKE_ALLOW_PUBLIC_IP: "true"
        run: |
          scripts/smoke_test_eks_admin_bastion_ssm.sh "$PRODUCT" "$AMI_ID" \
            | tee operations/reports/smoke-result.txt

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            operations/reports/smoke-cost.json
            operations/reports/smoke-result.txt
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 30

  catalog-validate:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out approved source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked runtime
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Assume Marketplace validator role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::582920575154:role/CoreNovaMarketplaceValidatorRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: "582920575154"
          mask-aws-account-id: true
          unset-current-credentials: true
          role-duration-seconds: 900
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Render and assert one AddDeliveryOptions plan
        env:
          PRODUCT: ${{ needs.build.outputs.product }}
          AMI_ID: ${{ needs.build.outputs.ami_id }}
          SOURCE_AMI_ID: ${{ needs.build.outputs.source_ami_id }}
        run: |
          args=(
            "$PRODUCT"
            "$AMI_ID"
            --access-role-arn "$MARKETPLACE_INGESTION_ROLE"
            --output-dir plans
          )
          if [[ -n "$SOURCE_AMI_ID" ]]; then
            args+=(--source-ami-id "$SOURCE_AMI_ID")
          fi
          CORENOVA_PRODUCTS_FILE=products.candidates.yaml \
            python scripts/render_marketplace_changeset.py "${args[@]}"
          if [[ "$PRODUCT" == "eks-admin-bastion-al2023-x86_64" ]]; then
            entity_id="prod-hapxotc2y7jmi"
          else
            entity_id="prod-nspz2g6ki6qvo"
          fi
          plan="plans/${PRODUCT}-add-version.json"
          jq -e \
            --arg ami "$AMI_ID" \
            --arg entity "$entity_id" \
            --arg role "$MARKETPLACE_INGESTION_ROLE" \
            '.Catalog == "AWSMarketplace"
             and (.ChangeSet | length) == 1
             and .ChangeSet[0].ChangeType == "AddDeliveryOptions"
             and .ChangeSet[0].Entity.Identifier == $entity
             and .ChangeSet[0].DetailsDocument.Version.VersionTitle != null
             and .ChangeSet[0].DetailsDocument.DeliveryOptions[0].Details.AmiDeliveryOptionDetails.AmiSource.AmiId == $ami
             and .ChangeSet[0].DetailsDocument.DeliveryOptions[0].Details.AmiDeliveryOptionDetails.AmiSource.AccessRoleArn == $role' \
            "$plan"

      - name: Submit VALIDATE only and wait for terminal status
        env:
          PRODUCT: ${{ needs.build.outputs.product }}
        run: |
          mkdir -p operations/reports
          plan="plans/${PRODUCT}-add-version.json"
          python scripts/submit_changeset.py \
            "$plan" \
            --products-file products.candidates.yaml \
            --intent VALIDATE \
            > operations/reports/start-change-set.json
          change_set_id="$(jq -r '.ChangeSetId' operations/reports/start-change-set.json)"
          [[ "$change_set_id" != "null" && -n "$change_set_id" ]]
          status=""
          for _ in $(seq 1 60); do
            aws marketplace-catalog describe-change-set \
              --region us-east-1 \
              --catalog AWSMarketplace \
              --change-set-id "$change_set_id" \
              --output json \
              > operations/reports/final-change-set.json
            status="$(jq -r '.Status' operations/reports/final-change-set.json)"
            case "$status" in
              SUCCEEDED)
                break
                ;;
              FAILED|CANCELLED)
                jq -r '.FailureDescription // "Marketplace validation failed"' \
                  operations/reports/final-change-set.json >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          [[ "$status" == "SUCCEEDED" ]]
          echo "CATALOG_VALIDATE_SUCCEEDED product=$PRODUCT"

      - name: Upload Marketplace VALIDATE evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-validate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            plans/${{ needs.build.outputs.product }}-add-version.json
            operations/reports/start-change-set.json
            operations/reports/final-change-set.json
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 30
