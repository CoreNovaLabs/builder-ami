name: Publish validated marketplace AMI version
run-name: Publish ${{ inputs.product }} from run ${{ inputs.validation_run_id }} at ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product key from products.yaml
        required: true
        type: string
      validation_run_id:
        description: Successful marketplace-rebuild run ID that validated the plan
        required: true
        type: string
      validation_attempt:
        description: Validation run attempt
        required: true
        default: "1"
        type: string
      expected_sha:
        description: Exact 40-character main commit SHA
        required: true
        type: string
      confirmation:
        description: Type PUBLISH_VALIDATED_MARKETPLACE_AMI
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: corenova-marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: marketplace-production
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the approved source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb90d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify validation run and explicit publish confirmation
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$VALIDATION_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMATION" == PUBLISH_VALIDATED_MARKETPLACE_AMI ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID" > /tmp/validation-run.json
          jq -e --arg product "$PRODUCT" \
            '.path == ".github/workflows/marketplace-rebuild.yml" and .event == "workflow_dispatch" and .head_branch == "main" and .status == "completed" and .conclusion == "success" and .display_title == ("Rebuild " + $product + " at " + .head_sha)' \
            /tmp/validation-run.json

      - name: Download the exact validated plan
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          VALIDATION_ATTEMPT: ${{ inputs.validation_attempt }}
        run: |
          mkdir -p operations/reports/validated
          gh run download "$VALIDATION_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "rebuild-validate-${VALIDATION_RUN_ID}-${VALIDATION_ATTEMPT}" \
            --dir operations/reports/validated
          test -f "operations/reports/validated/plans/${PRODUCT}-add-version.json"
          test -f operations/reports/validated/operations/reports/validate/final.json
          jq -e '.Intent == "VALIDATE" and .Status == "SUCCEEDED"' \
            operations/reports/validated/operations/reports/validate/final.json
          sha256sum "operations/reports/validated/plans/${PRODUCT}-add-version.json"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked runtime
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Assume production delivery publisher role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::582920575154:role/CoreNovaMarketplaceDeliveryPublisherRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: "582920575154"
          mask-aws-account-id: true
          unset-current-credentials: true
          role-duration-seconds: 10800
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Apply the validated single-AMI plan
        env:
          PRODUCT: ${{ inputs.product }}
        run: |
          mkdir -p operations/reports/publish
          python scripts/publish_changeset.py \
            "operations/reports/validated/plans/${PRODUCT}-add-version.json" \
            --confirm-apply > operations/reports/publish/start.json
          change_set_id="$(jq -r .ChangeSetId operations/reports/publish/start.json)"
          [[ "$change_set_id" =~ ^[A-Za-z0-9_-]{1,255}$ ]]
          status=""
          for _ in $(seq 1 680); do
            aws marketplace-catalog describe-change-set \
              --region us-east-1 --catalog AWSMarketplace \
              --change-set-id "$change_set_id" --output json \
              > operations/reports/publish/final.json
            status="$(jq -r .Status operations/reports/publish/final.json)"
            case "$status" in
              SUCCEEDED) break ;;
              FAILED|CANCELLED) jq -r '.FailureDescription // "APPLY failed"' operations/reports/publish/final.json >&2; exit 1 ;;
            esac
            sleep 15
          done
          [[ "$status" == SUCCEEDED ]]
          echo "CATALOG_APPLY_SUCCEEDED $change_set_id"

      - name: Upload publish evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketplace-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: operations/reports/publish
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 365
