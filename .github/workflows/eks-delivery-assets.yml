name: Publish immutable EKS delivery assets
run-name: Assets ${{ inputs.version_title }} at ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      version_title:
        description: Version title in vYYYYMMDD format
        required: true
        type: string
      expected_sha:
        description: Exact 40-character main commit SHA
        required: true
        type: string
      confirmation:
        description: Type PUBLISH_IMMUTABLE_EKS_ASSETS
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: corenova-eks-delivery-assets
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out approved source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable revision and inputs
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERSION_TITLE: ${{ inputs.version_title }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$VERSION_TITLE" =~ ^v[0-9]{8}$ ]]
          [[ "$CONFIRMATION" == PUBLISH_IMMUTABLE_EKS_ASSETS ]]

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked runtime
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Assume asset publisher role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::582920575154:role/CoreNovaMarketplaceAssetPublisherRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: "582920575154"
          mask-aws-account-id: true
          unset-current-credentials: true
          role-duration-seconds: 900
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish and verify every immutable asset
        env:
          VERSION_TITLE: ${{ inputs.version_title }}
        run: |
          mkdir -p operations/reports/assets
          prefix="eks-admin-bastion/${VERSION_TITLE}-${GITHUB_SHA:0:12}"
          scripts/publish_eks_delivery_assets.sh \
            corenova-marketplace-assets-582920575154 "$prefix" \
            | tee operations/reports/assets/publish-result.txt
          python scripts/package_eks_admin_delivery_assets.py \
            --output-dir operations/reports/assets/package >/dev/null
          printf '%s\n' \
            "https://corenova-marketplace-assets-582920575154.s3.amazonaws.com/$prefix" \
            > operations/reports/assets/base-url.txt
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg version "$VERSION_TITLE" \
            --arg base_url "$(<operations/reports/assets/base-url.txt)" \
            --arg manifest_sha256 "$(sha256sum operations/reports/assets/package/manifest.json | cut -d' ' -f1)" \
            '{status:"SUCCEEDED",commit:$commit,version:$version,base_url:$base_url,manifest_sha256:$manifest_sha256}' \
            > operations/reports/assets/evidence.json

      - name: Upload asset evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delivery-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: operations/reports/assets
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90
