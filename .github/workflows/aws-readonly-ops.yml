name: AWS Marketplace read-only operations

on:
  schedule:
    - cron: "15 0 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Report scope
        required: true
        default: all
        type: choice
        options:
          - all
          - cost
          - marketplace

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-marketplace-readonly-ops
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out immutable main revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked runtime
        run: python -m pip install --require-hashes --requirement requirements.lock

      - name: Assume read-only observer role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::582920575154:role/CoreNovaMarketplaceObserverRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: "582920575154"
          mask-aws-account-id: true
          unset-current-credentials: true
          role-duration-seconds: 900
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Select report scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="$REQUESTED_MODE"
          elif [[ "$SCHEDULE" == "15 0 * * *" ]]; then
            mode="cost"
          else
            mode="marketplace"
          fi
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"

      - name: Generate sanitized report
        run: |
          python scripts/aws_readonly_ops.py \
            --mode '${{ steps.scope.outputs.mode }}' \
            --max-projected 30 \
            --output operations/reports/aws-ops-report.json

      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-ops-${{ github.run_id }}-${{ github.run_attempt }}
          path: operations/reports/aws-ops-report.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
