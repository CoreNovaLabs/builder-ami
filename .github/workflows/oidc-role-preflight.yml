name: Verify guarded AWS OIDC roles

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string
      confirmation:
        description: Type VERIFY_OIDC_ROLES
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-oidc-role-preflight
  cancel-in-progress: false

jobs:
  guard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify immutable revision and confirmation
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$ACTUAL_SHA" ]]
          [[ "$CONFIRMATION" == "VERIFY_OIDC_ROLES" ]]

  verify:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - role_name: CoreNovaMarketplaceObserverRole
          - role_name: CoreNovaAmiBuilderRole
          - role_name: CoreNovaEksBastionSmokeRunnerRole
          - role_name: CoreNovaMarketplaceValidatorRole
    steps:
      - name: Assume ${{ matrix.role_name }}
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::582920575154:role/${{ matrix.role_name }}
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: "582920575154"
          mask-aws-account-id: true
          unset-current-credentials: true
          role-duration-seconds: 900
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify assumed identity without printing it
        env:
          EXPECTED_ROLE: ${{ matrix.role_name }}
        run: |
          caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
          [[ "$caller_arn" == arn:aws:sts::*:assumed-role/"$EXPECTED_ROLE"/* ]]
