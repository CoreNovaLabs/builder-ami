services:
  ollama:
    image: ollama/ollama:latest
    container_name: corenova-ollama
    restart: unless-stopped
    runtime: nvidia
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/root/.ollama/models
    volumes:
      - /mnt/models/ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: corenova-open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - OPENAI_API_BASE_URL=http://127.0.0.1:8000/v1
      - WEBUI_BIND_ADDRESS=127.0.0.1
      - WEBUI_PORT=8080
      - WEBUI_AUTH=${WEBUI_AUTH:-true}
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-false}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change-me}
      - WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL:-admin@local.host}
      - WEBUI_ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD:-}
      - DEFAULT_MODELS=${DEFAULT_MODELS:-qwen3:0.6b}
      - RAG_EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - HF_HUB_OFFLINE=0
    volumes:
      - /var/lib/open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: host

  vllm:
    profiles: [vllm]
    image: vllm/vllm-openai:latest
    container_name: corenova-vllm
    restart: unless-stopped
    runtime: nvidia
    ipc: host
    environment:
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - /mnt/models/vllm:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --tensor-parallel-size
      - "${VLLM_TENSOR_PARALLEL_SIZE:-1}"
      - --model
      - "${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
