#cloud-config
# CoreNova Enterprise AI Inference — first-boot hooks
cloud_final_modules:
  - [scripts-user, always]

# Regenerate SSH host keys before sshd starts (Marketplace scrub removes keys from AMI)
bootcmd:
  - [ bash, -c, 'if [ ! -f /etc/ssh/ssh_host_rsa_key ]; then /usr/bin/ssh-keygen -A; fi' ]

write_files:
  - path: /etc/corenova/first-boot-note.txt
    content: |
      CoreNova AI Sandbox first boot.
      Admin: admin@local.host · Password: EC2 Instance ID (see quickstart).
    permissions: '0644'

runcmd:
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, corenova-docker-gpu.service ]
  - [ systemctl, enable, setup-models-volume.service ]
  - [ systemctl, enable, corenova-bootstrap-admin.service ]
  - [ systemctl, enable, corenova-ai-stack.service ]
  - [ systemctl, enable, nginx.service ]
